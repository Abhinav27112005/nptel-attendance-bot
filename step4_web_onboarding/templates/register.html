<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport = mobile pe sahi dikhe (user mobile se kholega) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPTEL Attendance Bot — Register</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; max-width: 520px; margin: 0 auto; padding: 20px; background: #f0f2f5; color: #1c1e21; }
        h1 { color: #128C7E; font-size: 22px; }
        p.sub { color: #555; font-size: 14px; }
        .card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); margin-top: 16px; }
        label { display: block; font-weight: bold; margin: 14px 0 4px; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        input[type="file"] { padding: 10px; background: #fafafa; }
        .hint { font-size: 12px; color: #777; margin-top: 3px; }
        button { background: #25D366; color: #fff; border: none; padding: 14px; border-radius: 6px; font-size: 16px; font-weight: bold; width: 100%; margin-top: 20px; cursor: pointer; }
        button:disabled { background: #9e9e9e; }
        #result { margin-top: 16px; padding: 16px; border-radius: 8px; display: none; font-size: 14px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid #eee; }
        .row b { color: #128C7E; }
    </style>
</head>
<body>
    <h1>📋 NPTEL Attendance Bot</h1>
    <p class="sub">Apna <b>offer letter PDF</b> upload karo — details apne aap nikal lenge. Ek hi baar karna hai.</p>

    <div class="card">
        <form id="regForm">
            <label for="offer_letter">Offer Letter (PDF) *</label>
            <input type="file" id="offer_letter" name="offer_letter" accept="application/pdf" required>
            <div class="hint">NPTEL ka official offer letter PDF.</div>

            <label for="mobile">WhatsApp Number *</label>
            <input type="tel" id="mobile" name="mobile" placeholder="9198XXXXXXXX (country code ke saath)" required>
            <div class="hint">Isi number se bot identify karega. + ya space mat lagao.</div>

            <label for="default_login_time">Default Login Time</label>
            <input type="time" id="default_login_time" name="default_login_time" value="09:45">
            <div class="hint">Agar na batao to ye use hoga. Default: 09:45 AM</div>

            <button type="submit" id="submitBtn">Upload & Register 🚀</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        const form = document.getElementById('regForm');
        const btn = document.getElementById('submitBtn');
        const resultDiv = document.getElementById('result');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();           // page reload mat karo
            btn.disabled = true;
            btn.textContent = 'Processing... ⏳';
            resultDiv.style.display = 'none';

            try {
                // FormData = file + text fields ek saath bhejne ka tareeka
                const formData = new FormData(form);
                const res = await fetch('/register', { method: 'POST', body: formData });
                const data = await res.json();

                resultDiv.style.display = 'block';
                if (data.success) {
                    const p = data.profile;
                    resultDiv.className = 'success';
                    resultDiv.innerHTML =
                        `✅ <b>${data.message}</b><br><br>` +
                        `<div class="row"><span>ID</span><b>${p.internship_id}</b></div>` +
                        `<div class="row"><span>Name</span><b>${p.name}</b></div>` +
                        `<div class="row"><span>Institute</span><b>${p.institute}</b></div>` +
                        `<div class="row"><span>Professor</span><b>${p.professor}</b></div>` +
                        `<div class="row"><span>Mode</span><b>${p.mode}</b></div>` +
                        `<div class="row"><span>Duration</span><b>${p.duration}</b></div>` +
                        `<div class="row"><span>Start</span><b>${p.start_date}</b></div>` +
                        `<div class="row"><span>End</span><b>${p.end_date}</b></div>` +
                        `<div class="row"><span>Mobile</span><b>${p.mobile}</b></div>`;
                } else {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = `❌ ${data.error}`;
                }
            } catch (err) {
                resultDiv.style.display = 'block';
                resultDiv.className = 'error';
                resultDiv.innerHTML = `❌ Network error: ${err.message}`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Upload & Register 🚀';
            }
        });
    </script>
</body>
</html>
